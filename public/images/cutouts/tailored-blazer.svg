<svg width="500" height="700" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="charcoalWool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="lapelShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Main Jacket Body with Structured Shoulder Pads -->
    <path d="M 175 45 L 115 75 L 40 220 L 85 245 L 135 160 L 135 590 Q 250 610 365 590 L 365 160 L 415 245 L 460 220 L 385 75 L 325 45 Z" 
          fill="url(#charcoalWool)" stroke="#111111" stroke-width="2"/>

    <!-- Left & Right Sleeve Creases -->
    <path d="M 115 75 L 135 160" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M 385 75 L 365 160" stroke="#1A1A1A" stroke-width="3"/>

    <!-- Deep V-Chest Cutout -->
    <polygon points="215,45 250,290 285,45" fill="#F8F6F0"/>
    <!-- Black Tie / Collar Preview in V -->
    <polygon points="244,110 256,110 258,260 250,285 242,260" fill="#0F172A"/>

    <!-- Peak Lapels Left & Right -->
    <polygon points="175,45 210,140 180,155 245,310 215,45" fill="url(#lapelShade)" stroke="#151515" stroke-width="2"/>
    <polygon points="325,45 290,140 320,155 255,310 285,45" fill="url(#lapelShade)" stroke="#151515" stroke-width="2"/>

    <!-- Double Breasted Flap Overlap -->
    <path d="M 270 290 L 270 595" stroke="#161616" stroke-width="2"/>

    <!-- Horn Buttons (Double Breasted: 6 buttons total) -->
    <circle cx="225" cy="340" r="7" fill="#141414" stroke="#444444" stroke-width="1.5"/>
    <circle cx="275" cy="340" r="7" fill="#141414" stroke="#444444" stroke-width="1.5"/>
    <circle cx="225" cy="410" r="7" fill="#141414" stroke="#444444" stroke-width="1.5"/>
    <circle cx="275" cy="410" r="7" fill="#141414" stroke="#444444" stroke-width="1.5"/>
    <circle cx="225" cy="480" r="7" fill="#141414" stroke="#444444" stroke-width="1.5"/>
    <circle cx="275" cy="480" r="7" fill="#141414" stroke="#444444" stroke-width="1.5"/>

    <!-- Welt Chest Pocket -->
    <line x1="160" y1="210" x2="210" y2="210" stroke="#3D3D3D" stroke-width="3"/>
    <!-- Flap Pockets -->
    <rect x="155" y="440" width="65" height="18" rx="2" fill="#292929" stroke="#151515" stroke-width="1.5"/>
    <rect x="280" y="440" width="65" height="18" rx="2" fill="#292929" stroke="#151515" stroke-width="1.5"/>
  </g>
</svg>

